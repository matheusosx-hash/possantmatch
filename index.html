<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PossantMatch</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.tiktok.com https://*.tiktokcdn.com https://*.tiktokv.com https://*.tiktokcdn-us.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https://*.supabase.co https://parallelum.com.br https://*.tiktok.com; frame-src https://www.tiktok.com https://*.tiktok.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="description" content="PossantMatch: blog, ferramentas, fórum e o match que escolhe o carro certo para a sua rotina.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* PossantMatch: preto, ciano, laranja e branco */
  --bg:#FFFFFF; --surface:#F3F8FA; --ink:#000000; --muted:#52646E; --line:#D6E3E9;
  --faixa:#FF5722; --faixa-ink:#000000; --ciano:#00BCD4; --ciano-ink:#006E86;
  --placa:#00809B; --placa-soft:#DDF3FA; --alerta:#C2410C; --alerta-soft:#FFEBDD;
  --asfalto:#000000; --sel:#000000; --sel-ink:#FFFFFF;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A141B; --surface:#12212B; --ink:#EAF6FB; --muted:#93AEBB; --line:#21384A;
    --ciano-ink:#5FD6EF; --placa:#3FD0EE; --placa-soft:#0E3442; --alerta:#FF8A4C; --alerta-soft:#3A2015;
    --asfalto:#05090C; --sel:#00BCD4; --sel-ink:#000000;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A141B; --surface:#12212B; --ink:#EAF6FB; --muted:#93AEBB; --line:#21384A;
  --ciano-ink:#5FD6EF; --placa:#3FD0EE; --placa-soft:#0E3442; --alerta:#FF8A4C; --alerta-soft:#3A2015;
  --asfalto:#05090C; --sel:#00BCD4; --sel-ink:#000000;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--asfalto)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--faixa);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:0 18px 48px}
.wide{max-width:1120px}

/* Estrada (progresso) */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--asfalto);color:#fff}
.topbar .in{max-width:680px;margin:0 auto;padding:12px 18px 14px;display:flex;flex-direction:column;gap:10px}
.topbar .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand{font-stretch:125%;font-weight:800;font-size:17px;letter-spacing:.01em}
.brand b{color:var(--ciano)}
.km{font-size:14px;color:#C7D0D7;font-variant-numeric:tabular-nums}
.road{position:relative;height:30px;border-radius:6px;background:#3A464F;overflow:hidden}
.road::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:repeating-linear-gradient(90deg,var(--faixa) 0 18px,transparent 18px 32px)}
.road .done{border-right:2px solid var(--ciano);position:absolute;inset:0 auto 0 0;background:rgba(0,188,212,.22);transition:width .45s ease}
.road .car{position:absolute;top:50%;width:38px;height:20px;margin:-10px 0 0 -38px;transition:left .45s ease}
.road .flag{position:absolute;right:6px;top:7px;width:16px;height:16px;background:conic-gradient(#fff 0 25%,#222 0 50%,#fff 0 75%,#222 0) 0 0/8px 8px;border-radius:2px}

/* Abertura */
.hero{background:radial-gradient(120% 90% at 100% 0%,rgba(0,188,212,.35),transparent 55%),var(--asfalto);color:#fff;padding:56px 0 64px;position:relative;overflow:hidden}
.hero .wrap{padding-bottom:0}
.hero h1 span{color:var(--ciano)}
.hero h1{font-stretch:125%;font-weight:800;font-size:clamp(44px,11vw,84px);line-height:.95;margin:0 0 20px;letter-spacing:-.01em}
.hero p{color:#C7D0D7;max-width:34ch;font-size:19px;margin:0 0 28px}
.hero .lane{position:absolute;left:0;right:0;bottom:22px;height:6px;background:repeating-linear-gradient(90deg,var(--faixa) 0 56px,transparent 56px 96px);animation:lane 1.6s linear infinite}
@keyframes lane{to{background-position:-96px 0}}
@media (prefers-reduced-motion: reduce){.hero .lane{animation:none}.road .done,.road .car{transition:none}}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:36px 0 0;padding:0;list-style:none}
.facts li{border-top:2px solid #45525C;padding-top:10px;font-size:15px;color:#C7D0D7}
.facts strong{display:block;color:#fff;font-stretch:115%;font-size:20px}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:14px 22px;font-weight:700;cursor:pointer;min-height:48px;text-decoration:none}
.btn-go{background:var(--faixa);color:var(--faixa-ink)}
.btn-go:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn-sm{min-height:40px;padding:8px 14px;font-size:15px}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:15px}

/* Pergunta */
.q{padding-top:28px}
.q h2{font-stretch:112%;font-weight:800;font-size:clamp(26px,6.4vw,34px);line-height:1.12;margin:0 0 8px}
.q .help{color:var(--muted);margin:0 0 22px;max-width:56ch}
.block{margin:0 0 26px}
.block > .lbl{display:block;font-weight:700;margin:0 0 10px;font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tiles.cols1{grid-template-columns:1fr}
.tile{position:relative;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 14px 13px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:56px;transition:border-color .15s,background .15s}
.tile:hover{border-color:var(--muted)}
.tile .t{font-weight:700;line-height:1.25}
.tile .d{font-size:14px;color:var(--muted);line-height:1.35}
.tile[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:var(--sel-ink)}
.tile[aria-pressed="true"] .d{color:inherit;opacity:.8}
.tile .ord{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;background:var(--faixa);color:#1F2933;font-weight:800;font-size:14px;display:grid;place-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:15px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.field{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;min-height:50px}
.two{display:grid;grid-template-columns:110px 1fr;gap:10px}
.range{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px}
.range .val{font-stretch:112%;font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.range input{width:100%;accent-color:var(--faixa);margin:8px 0 2px}
.range .ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.steppers{display:grid;gap:8px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px 10px 14px}
.stepper .t{font-weight:700}
.stepper .d{font-size:14px;color:var(--muted)}
.stepper .ctl{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-weight:700;cursor:pointer}
.stepper output{min-width:28px;text-align:center;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:8px;position:sticky;bottom:0;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.nav .btn-go{flex:1;max-width:320px;margin-left:auto}
.hint{font-size:14px;color:var(--muted);margin:-14px 0 20px}

/* Resumo */
.sum{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:4px 16px;margin-bottom:20px}
.sum div{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.sum div:last-child{border-bottom:0}
.sum dt{color:var(--muted);font-size:15px;min-width:110px}
.sum dd{margin:0;text-align:right;font-weight:600;font-size:15px}

/* Resultados */
.res-head{padding:30px 0 6px}
.res-head h2{font-stretch:118%;font-weight:800;font-size:clamp(30px,7vw,46px);line-height:1.05;margin:0 0 10px}
.res-head p{color:var(--muted);margin:0;max-width:62ch}
.cars{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin:24px 0}
.car{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.car .top{padding:18px 18px 0}
.car .rank{display:inline-block;background:var(--faixa);color:#1F2933;font-weight:800;font-size:14px;border-radius:6px;padding:3px 9px;margin-bottom:12px}
.car h3{font-stretch:118%;font-weight:800;font-size:30px;line-height:1;margin:0}
.car .ver{color:var(--muted);margin:4px 0 14px;font-size:15px}
.match{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700}
.match .bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.match .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ciano),var(--placa))}
.price{margin:16px 0 0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.price strong{font-stretch:112%;font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
.price span{font-size:14px;color:var(--muted)}
.kf{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:0;padding:0 18px}
.kf div{padding:12px 0;border-bottom:1px solid var(--line)}
.kf div:nth-child(odd){padding-right:10px;border-right:1px solid var(--line)}
.kf div:nth-child(even){padding-left:12px}
.kf dt{font-size:13px;color:var(--muted)}
.kf dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.why{list-style:none;margin:14px 18px 0;padding:0;display:grid;gap:6px;font-size:15px}
.why li{padding-left:24px;position:relative;line-height:1.4}
.why li::before{content:"";position:absolute;left:2px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--placa)}
.why li.warn::before{background:var(--alerta);border-radius:2px;transform:rotate(45deg) scale(.85)}
.acts{display:flex;gap:8px;padding:16px 18px 18px;margin-top:auto}
.acts .btn{flex:1}
.tip{background:var(--placa-soft);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.removed{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px;font-size:15px}
.removed .chip{font-size:14px;padding:6px 12px}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:18px;margin:0 0 16px}
.panel h3{font-stretch:112%;font-weight:800;font-size:22px;margin:0 0 6px}
.panel p{margin:0 0 12px;color:var(--muted)}
.cmp{overflow-x:auto}
.cmp table{border-collapse:collapse;min-width:560px;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
.cmp th,.cmp td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
.cmp thead th{font-stretch:112%;font-weight:800;font-size:16px}
.cmp tbody th{color:var(--muted);font-weight:600;white-space:nowrap}
.cmp td.best{color:var(--placa);font-weight:800}
.fuel{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.fuel label{font-size:14px;color:var(--muted);display:grid;gap:4px}
.fuel input{background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px;color:var(--ink)}
.fin{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:6px}
.fin div{border-left:3px solid var(--ciano);padding:2px 0 2px 12px}
.fin dt{font-size:13px;color:var(--muted)}
.fin dd{margin:0;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.foot{font-size:13px;color:var(--muted);max-width:70ch;margin-top:20px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.hidden{display:none!important}
@media (max-width:480px){.facts{grid-template-columns:1fr;gap:10px}.two{grid-template-columns:90px 1fr}}

.tile.off{opacity:.45;border-style:dashed;cursor:not-allowed}
.tile.off:hover{border-color:var(--line)}
.tile .cnt{font-size:13px;font-weight:700;color:var(--placa);margin-top:4px}
.tile[aria-pressed="true"] .cnt{color:inherit}
.chip.off{opacity:.4;border-style:dashed;cursor:not-allowed}
.notes{display:grid;gap:8px;margin:0 0 18px}
.notes:empty{display:none}
.nt{border-radius:10px;padding:11px 13px 11px 14px;font-size:15px;line-height:1.4;border-left:4px solid var(--faixa);background:var(--surface)}
.nt.warn{border-left-color:var(--alerta);background:var(--alerta-soft)}
.nt.err{border-left-color:var(--alerta);background:var(--alerta-soft);font-weight:600}
.nt.ok{border-left-color:var(--placa);background:var(--placa-soft)}
.flash{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(560px,calc(100% - 28px));z-index:20;background:var(--alerta);color:#fff;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.flash:empty{display:none}
.costs td.tot,.costs th.tot{font-weight:800;color:var(--ink);border-top:2px solid var(--ink)}
.kf.k3{grid-template-columns:1fr 1fr}
.cnt-big{font-weight:800;color:var(--placa)}
.evnote{margin:14px 18px 0;font-size:14px}
.car h3 .yr{font-stretch:100%;font-weight:700;font-size:20px;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.money{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;padding:14px 18px 4px}
.money div{border-left:3px solid var(--ciano);padding:2px 0 2px 10px;display:flex;flex-direction:column}
.money span{font-size:13px;color:var(--muted)}
.money strong small{font-size:13px;font-weight:700;color:var(--muted)}
.money strong{font-stretch:100%;font-weight:800;font-size:19px;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.2}
.money em{font-style:normal;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.motor,.equip{padding:4px 18px 0}
.motor h4,.equip h4{font-stretch:112%;font-size:16px;margin:14px 0 6px}
.motor p{margin:0 0 3px;font-size:15px}
.mut{color:var(--muted);font-size:13px;font-weight:400}
.trsel{display:grid;grid-template-columns:1fr 1.4fr 100px;gap:8px}
@media (max-width:480px){.trsel{grid-template-columns:1fr 1fr}.trsel select:last-child{grid-column:1/-1}}
.eg{margin:0 0 8px}
.eg-t{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
.eg-l{display:flex;flex-wrap:wrap;gap:5px}
.eq{font-size:13px;border-radius:999px;padding:3px 9px;border:1px solid var(--line);color:var(--muted);opacity:.7}
.eq.on{opacity:1;color:var(--ink);background:var(--placa-soft);border-color:transparent;font-weight:600}

/* Viagem */
.trip{margin:14px 18px 0;border-radius:12px;background:var(--placa-soft);padding:12px 14px}
.trip-t{font-size:13px;font-weight:700;color:var(--ciano-ink);text-transform:uppercase;letter-spacing:.04em}
.trip-n{display:flex;flex-wrap:wrap;gap:6px 18px;margin:6px 0}
.trip-n div{display:flex;flex-direction:column}
.trip-n strong{font-stretch:110%;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.trip-n em{font-style:normal;font-size:13px;color:var(--muted)}
.trip p{margin:0;font-size:13px;color:var(--muted)}
/* Ficha completa em painel */
body.locked{overflow:hidden}
.sheet-bg{position:fixed;inset:0;background:rgba(5,9,12,.55);z-index:30;animation:fade .2s ease}
.sheet{position:fixed;z-index:31;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);max-height:min(92vh,900px);display:flex;flex-direction:column;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.3);animation:up .25s ease}
@media (min-width:800px){.sheet{bottom:auto;top:50%;transform:translate(-50%,-50%);border-radius:20px}}
@keyframes up{from{opacity:0;translate:0 30px}}@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion: reduce){.sheet,.sheet-bg{animation:none}}
.sh-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:18px 18px 10px;background:var(--asfalto);color:#fff;border-radius:inherit;border-bottom-left-radius:0;border-bottom-right-radius:0}
.sh-k{margin:0;font-size:13px;color:var(--ciano);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.sh-h h3{font-stretch:118%;font-weight:800;font-size:28px;line-height:1.05;margin:2px 0}
.sh-h .yr{color:#9FB6C2;font-size:18px}
.sh-h .ver{margin:0;color:#C9D9E1;font-size:14px}
.sh-x{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:18px;cursor:pointer}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:var(--asfalto);scrollbar-width:none}
.tabs button{flex:none;border:0;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;background:rgba(255,255,255,.1);color:#DCE9EF;cursor:pointer;min-height:38px}
.tabs button[aria-selected="true"]{background:var(--faixa);color:#000000}
.sh-b{overflow-y:auto;padding:16px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sh-b h5{font-stretch:112%;font-size:15px;margin:18px 0 8px}
.sh-b .equip{padding:0}.sh-b .equip h4{margin-top:0}
.sts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sts.big{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.st{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:1px}
.st span{font-size:12px;color:var(--muted);font-weight:600}
.st strong{font-weight:800;font-size:16px;line-height:1.25;font-variant-numeric:tabular-nums}
.sts.big .st strong{font-stretch:112%;font-size:24px;color:var(--ink)}
.sts.big .st{border-left:4px solid var(--faixa)}
.st em{font-style:normal;font-size:12px;color:var(--muted)}
.sbar{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px;background:var(--line)}
.leg{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px;font-size:14px}
.leg li{display:flex;align-items:center;gap:8px}
.leg b{width:12px;height:12px;border-radius:3px;flex:none}
.leg li>span:last-child{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.ctab{width:100%;border-collapse:collapse;background:var(--surface);border-radius:12px;overflow:hidden;font-variant-numeric:tabular-nums;font-size:15px}
.ctab th,.ctab td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
.ctab thead th{font-size:12px;color:var(--muted)}
.ctab tbody th{font-weight:700}
.dep{display:grid;gap:8px}
.dep div{display:grid;grid-template-columns:88px 1fr 96px 44px;align-items:center;gap:8px;font-size:14px}

function perfilSeg(){const a=A();let r=1;const i=a.idade;r*=i<=21?1.75:i<=25?1.5:i<=30?1.2:i<=55?1:i<=65?1.05:1.15;
  r*={masculino:1.06,feminino:.95}[a.sexo]||1;r*={casado:.92,solteiro:1.05,viuvo:.98}[a.civil]||1;r*={'0-2':1.25,'2-5':1.08,'10+':.95}[a.hab]||1;
  r*={jovem:1.3,adulto:1.03}[a.outros]||1;const u=usosEff();r*=u.has('app')?1.45:u.has('logistica')?1.35:u.has('externo')?1.1:1;
  if(a.dono==='nao')r*=1.05;if(a.residencia==='apto')r*=.95;r*={garagem_auto:.88,garagem:.92,estac:.97,rua:1.3}[a.pernoite]||1;
  r*={garagem:.97,rua:1.08,nao:.95}[a.diurno]||1;if(a.faculdade==='rua')r*=1.06;r*={rastreador:.88,alarme:.97}[a.antifurto]||1;

function seguro(c,pr){const a=A(),v=pr.v,pf=perfilSeg();let cob=a.cobertura||'completa',nota='';

  const base=.034*Math.pow(Math.max(v,15000)/120000,-.15)*c.risco*pf*(pr.anos>=15?1.1:1)*(a.blindado==='sim'?1.12:1);
  let mid;if(cob==='completa')mid=Math.max(1500,v*base*({reduzida:1.15,majorada:.88}[a.franquia]||1));else if(cob==='roubo')mid=Math.max(900,v*base*.5);else mid=Math.max(600,900*pf);

const COB_LBL={completa:'completa',roubo:'roubo, furto e terceiros',terceiros:'só terceiros'};
function financ(price){
  const a=A(),tr=a.troca==='sim'?a.valorTroca:0,ent=Math.min(price,a.entrada+tr);

    if(base<=0)return {tipo:'fin',ent,base:0,parcela:0,n:a.prazo,juros1:0,total:0};
    const pv=base*1.03,i=S.P.juros/100,n=a.prazo;

  }

function maxPriceForParcela(){
  const a=A(),i=S.P.juros/100,n=a.prazo,tr=a.troca==='sim'?a.valorTroca:0;

function custos(c,pr,en){
  const a=A(),uf=a.uf||'SP';

  const aliq=IPVA[uf]||IPVA_BR;const isen=IPVA_ISEN[uf]||15;const ipvaIsento=pr.anos>=isen;const ipva=ipvaIsento?0:pr.v*aliq/100;
  const seg=seguro(c,pr);
  const rev=c.fuel==='ev'?650:(c.ano?({5:1300,4:1700,3:2400,2:3200,1:4500}[c.mnt]||2000):({5:900,4:1300,3:1900,2:3200,1:4500}[c.mnt]||1500));
  const desg=c.ano?(pr.anos>=15?2200:1600):pr.anos===0?0:pr.anos<=3?700:1400;
  const lic=160;
  const dep=pr.v*(pr.anos===0?c.d1:c.da);

}

function condOk(c,a){const k=a.condicao;if(c.ano){const age=ANO-c.ano;if(k==='0km'||k==='seminovo')return false;if(k==='usado')return age<=10;return true}const g=genAnos(c);if(k==='seminovo')return g>=1;if(k==='usado')return g>=4;return k!=='antigo'}
function pool(over={},skip=[]){
  const a={...A(),...over};const nd=needs(a);const B=a.orcamento;
  const dieselOk=a.terra==='frequente'||has(a.bagagem,'carga')||has(a.bagagem,'reboque')||has(a.carroceria,'picape');
  return CARS.filter(c=>{
    if(!skip.includes('marca')&&has(a.marcasEvitar,c.m))return false;
    if(!skip.includes('cambio')&&a.cambio==='auto'&&c.man)return false;
    if(!skip.includes('cambio')&&a.cambio==='manual'&&!c.man)return false;
    if(!skip.includes('comb')&&a.comb){
      if(a.comb==='flex'&&!['flex','diesel','gasolina'].includes(c.fuel))return false;
      if(a.comb==='hibrido'&&c.fuel==='ev')return false;
    }
    if(!skip.includes('lug')&&nd.pessoas>5&&c.lug<7)return false;
    if(!skip.includes('lug')&&c.lug<nd.pessoas)return false;
    if(a.portas==='4'&&(c.portas||4)<4)return false;
    if(!skip.includes('body')&&a.carroceria.length&&!has(a.carroceria,'sem')){
      const ok=has(a.carroceria,c.body)||(has(a.carroceria,'minivan')&&c.lug>=7);if(!ok)return false;
    }
    if(!skip.includes('itens')&&!a.itens.every(it=>hasItem(c,it)))return false;
    if(!skip.includes('cond')&&!condOk(c,a))return false;
    if(!skip.includes('preco')&&priceFor(c,a).v>B*1.05)return false;
    return true;
  });
}

/* Valor FIPE (outubro/2026) por modelo e ano-modelo, tirado dos usados da base: média das versões daquele ano */

  return Object.values(g).map(x=>({m:x.m,mod:x.mod,v:Object.fromEntries(Object.entries(x.s).map(([y,a])=>[y,Math.round(a.reduce((s,v)=>s+v,0)/a.length/100)*100]))}))})();

const TROCA_PCT=.85;
function trocaFipe(a=A()){const t=TROCA.find(x=>x.m===a.trocaMarca&&x.mod===a.trocaMod);return t&&t.v[a.trocaAno]||0}

   ${v?`<div class="nt ok" style="margin-top:10px">Tabela FIPE de ${FIPE_MES} para ${esc(a.trocaMod)} ${a.trocaAno}: <strong>${brl(v)}</strong> (média das versões desse ano na nossa base). Na troca, as lojas costumam pagar de 80% a 90% da FIPE, então usamos <strong>${brl(Math.round(v*TROCA_PCT/1000)*1000)}</strong>.</div>`:'<p class="hint" style="margin:8px 0 0">Não achou o seu? Informe o valor abaixo.</p>'}`);
}

/* ===================== RECOMENDAÇÃO ===================== */
function evaluate(){
  const a=A(),nd=needs(),B=a.orcamento;
  const rows=pool().map(c=>{const pr=priceFor(c);const en=energy(c);return {c,pr,en,cu:custos(c,pr,en)}});
  if(!rows.length)return [];
  const minCost=Math.min(...rows.map(r=>r.en.cost)),maxPw=Math.max(...rows.map(r=>r.c.cvn/r.c.peso));
  const minSeg=Math.min(...rows.map(r=>r.cu.seg.mid/r.pr.v));
  const W={economia:.6,seguranca:.6,espaco:.6,conforto:.6,desempenho:.5,tecnologia:.5,revenda:.6,manutencao:.6,seguro:.5,garantia:.4};
  a.prioridades.slice(0,5).forEach((p,i)=>W[p]=[3,2.4,1.8,1.3,1][i]);
  if(a.kmMes>=2500)W.economia+=.8;
  const ue=usosEff();if(ue.has('app')){W.economia+=.8;W.manutencao+=.6}if(ue.has('logistica')){W.espaco+=1;W.economia+=.6;W.manutencao+=.5}if(ue.has('lazer')){W.conforto+=.5;W.espaco+=.4}
  if(a.permanencia==='curto')W.revenda+=.8;
  if(a.permanencia==='longo'){W.garantia+=.6;W.manutencao+=.4}
  return rows.map(r=>{
    const c=r.c,pr=r.pr,cu=r.cu,why=[],warn=[];
    const pm=(c.pm7&&nd.pessoas>5)?c.pm7:c.pm;
    const M={economia:minCost/r.en.cost,seguranca:(c.seg/5)*.75+(c.bags>=6?.25:.1),
      espaco:Math.min(pm/520,1)*.5+(c.lug>=7?1:Math.min(c.dim[1]/1850,1))*.5,conforto:c.conf/5,
      desempenho:(c.cvn/c.peso)/maxPw,tecnologia:c.tec/5,revenda:Math.max(0,1-((c.d1+c.da*2)-.18)/.2),
      manutencao:c.mnt/5,seguro:minSeg/(cu.seg.mid/pr.v),garantia:Math.min(c.gar,6)/6};
    let sw=0,sv=0;for(const k in W){sw+=W[k];sv+=W[k]*M[k]}let s=sv/sw;
    const ratio=pr.v/B;
    if(ratio>1){s-=.05;warn.push(`Passa ${Math.round((ratio-1)*100)}% do orçamento`)}
    else if(ratio<.55)s-=.06;
    else{s+=.03;why.push(ratio<.85?`Cabe no orçamento com folga de ${brl(B-pr.v)}`:'Aproveita bem o orçamento')}
    if(cu.f&&cu.f.tipo==='fin'&&cu.f.parcela>0&&cu.f.ent<pr.v*ENT_MIN){s-=.03;warn.push(`Entrada de ${Math.round(cu.f.ent/pr.v*100)}% fica abaixo dos 30% recomendados (${brl(pr.v*ENT_MIN)})`)}
    if(cu.f&&cu.f.parcela>0){if(cu.f.parcela>a.parcela*1.05){s-=Math.min(.2,(cu.f.parcela/a.parcela-1)*.5);warn.push(`Parcela estimada de ${brl(cu.f.parcela)} passa do seu limite`)}else why.push(`Parcela estimada de ${brl(cu.f.parcela)} cabe no seu limite`)}
    if(c.lug>=7&&nd.pessoas>5)why.push('7 lugares para toda a família');
    if(nd.seats>=3&&c.lug<7&&c.dim[1]<1800){s-=.12;warn.push('Três assentos infantis lado a lado ficam apertados')}
    else if(nd.seats>=2&&c.dim[1]>=1780&&c.lug<7){s+=.03;why.push('Banco traseiro largo para assentos infantis')}
    if(c.cacamba){if(has(a.bagagem,'carga')||has(a.bagagem,'reboque')){s+=.08;why.push(`Caçamba de ${c.pm} L para carga`)}else if(nd.trunk>300)warn.push('Bagagem fica exposta na caçamba')}
    else if(pm<nd.trunk){s-=Math.min(.22,(nd.trunk-pm)/nd.trunk*.4);warn.push(`Porta-malas de ${pm} L é justo para os ${nd.trunk} L que você precisa`)}
    else if(pm>=nd.trunk+60)why.push(`Porta-malas de ${pm} L atende aos ${nd.trunk} L que você precisa`);
    if(a.terra==='frequente'){if(c.alt<170){s-=.12;warn.push(`Altura do solo de ${c.alt} mm é baixa para estrada de terra`)}else if(c.alt>=195){s+=.05;why.push(`${c.alt} mm de altura do solo para estrada de terra`)}}
    else if(a.terra==='asvezes'&&c.alt<150){s-=.04;warn.push('Cuidado com valetas e quebra-molas altos')}
    const L=c.dim[0];
    if(a.vagaTam==='apertada'){if(L>4800){s-=.15;warn.push(`${n1(L/1000)} m de comprimento: pode não caber na vaga`)}else if(L>4500){s-=.07;warn.push(`${n1(L/1000)} m de comprimento: confira a vaga`)}else if(L<4200){s+=.04;why.push('Compacto, fácil de manobrar na garagem')}}
    if(has(a.acess,'idoso')&&(c.body==='suv'||c.body==='minivan')){s+=.04;why.push('Banco alto facilita a entrada de idosos')}
    if(has(a.acess,'alto')&&c.dim[0]<3800){s-=.08;warn.push('Pouco espaço para motorista alto')}
    if(c.fuel==='ev'){if(a.recarga==='nao'){s-=.1;warn.unshift('Sem carregador em casa, pode não sair tão barato: carga pública custa até 2,5 vezes mais')}else warn.unshift('Precisa de carregador instalado em casa')
      if(['mes','semana'].includes(a.viagens)&&a.distViagem>c.aut*.8){s-=.12;warn.push(`Autonomia de ${c.aut} km exige parada para recarga nas suas viagens`)}}
    if(a.usoPred==='estrada'&&c.cvn<90){s-=.06;warn.push('Motor fraco para ultrapassagens na estrada')}
    if(r.en.cost<=minCost*1.05)why.push('Menor custo por km entre as opções');
    if(ue.has('logistica')){if(c.body==='furgao'||c.body==='picape'){s+=.14;why.push(c.body==='furgao'?`Furgão com ${n1(c.pm/1000)} m³ de carga`:`Caçamba de ${c.pm} L para entregas`)}else if(c.pm>=450){s+=.03;why.push('Porta-malas grande para mercadoria')}else s-=.06;if(c.mnt<=2){s-=.08;warn.push('Manutenção cara para uso comercial')}}
    if(cu.ipvaIsento)why.unshift(`Isento de IPVA em ${a.uf} pela idade do carro`);
    if(c.bags===0)warn.push('Sem airbags: é anterior à obrigatoriedade de 2014');
    if(nd.seats&&c.ano&&c.ano<2015){s-=.08;warn.push('Sem Isofix para fixar assentos infantis')}
    if(cu.seg.nota)warn.push('Seguro completo dificilmente aceito pela idade');
    if(c.fuel==='hibrido'||c.fuel==='hibridog')why.push('Híbrido: consumo baixo na cidade');
    if(N(c,'adas'))why.push('Frenagem autônoma de série');
    if(M.revenda>.8)why.push('Desvaloriza menos que a média');
    if(c.gar>=5&&a.permanencia==='longo')why.push(`Garantia de ${c.gar} anos`);
    if(a.cambio==='tanto'&&c.man)s-=.02;
    if(has(a.marcasPref,c.m)){s+=.06;why.push(`Marca da sua preferência`)}
    const match=Math.round(Math.max(25,Math.min(97,40+(s-.3)*70)));
    return {...r,pm,s,match,why:why.slice(0,4),warn:warn.slice(0,3)};
  }).sort((x,y)=>y.s-x.s);
}

/* Consumo de estrada e custo de viagem (só combustível ou energia) */
const VIAG_ANO={raro:1,ano:4,mes:12,semana:52};
function viagem(c){
  const a=A(),P=S.P,km=a.distViagem;let porKm,fonte,alcance;
  if(c.fuel==='ev'){porKm=c.kwh/100*P.kp;fonte='recarga em carregador público';alcance=c.aut*.85}
  else if(c.fuel==='diesel'){porKm=P.d/c.cd[1];fonte='diesel';alcance=c.tanque*c.cd[1]}
  else{const g=P.g/c.cg[1],e=c.ce?P.e/c.ce[1]:Infinity;porKm=Math.min(g,e);fonte=e<g?'etanol':'gasolina';alcance=c.tanque*(e<g?c.ce[1]:c.cg[1])}
  const ida=porKm*km,ret=ida*2,n=VIAG_ANO[a.viagens]||0;
  const paradas=Math.max(0,Math.ceil(km/alcance)-1);
  return {km,ida,ret,ano:ret*n,n,fonte,alcance:Math.round(alcance/10)*10,paradas};
}
function consLinha(c,i){
  if(c.fuel==='ev')return i?`cerca de ${Math.round(c.aut*.85)} km de autonomia`:`${n1(c.kwh)} kWh/100 km, ${c.aut} km de autonomia`;
  if(c.fuel==='diesel')return `${n1(c.cd[i])} km/l diesel`;
  return c.ce?`${n1(c.ce[i])} E · ${n1(c.cg[i])} G km/l`:`${n1(c.cg[i])} km/l gasolina`;
}
const VIAG_NOTA='Só combustível ou energia. Não inclui pedágio, estacionamento, alimentação, hospedagem nem imprevistos.';

  return `<div class="sts">${tile('Comprimento',n1(d[0]/1000)+' m')}${tile('Largura',n1(d[1]/1000)+' m')}${tile('Altura',n1(d[2]/1000)+' m')}${tile('Entre-eixos',d[3].toLocaleString('pt-BR')+' mm','quanto maior, mais espaço para as pernas')}${tile('Altura do solo',c.alt+' mm',c.alt>=195?'boa para terra e valetas':c.alt<150?'cuidado com valetas':'')}${tile(c.body==='furgao'?'Carga':c.cacamba?'Caçamba':'Porta-malas',c.pm.toLocaleString('pt-BR')+' L',c.pm7?`${c.pm7} L com 7 lugares`:'')}${tile('Lugares',c.lug)}${tile('Portas',c.portas||4)}</div>`;
}
function valorTab(r){
  const c=r.c,pr=r.pr,rows=[[0,pr.v],...depRows(c,pr)];
  return `<div class="sts">${c.ano?tile('Ano-modelo',c.ano):tile('Preço 0 km de referência',brl(c.p))}${tile('Valor na compra',brl(pr.v),pr.lbl)}</div>
   <h5>Quanto o carro vale com o tempo</h5><div class="dep">${rows.map(([y,v])=>`<div><span>${y?`Após ${y} ${plural(y,'ano','anos')}`:'Hoje'}</span><b><i style="width:${Math.round(v/pr.v*100)}%"></i></b><strong>${brl(v)}</strong>${y?`<em>−${Math.round((1-v/pr.v)*100)}%</em>`:'<em></em>'}</div>`).join('')}</div>
   <p class="note">Projeção estimada. Consulte o valor atualizado na <a href="https://veiculos.fipe.org.br/" target="_blank" rel="noopener">Tabela FIPE</a>.</p>`;
}
function sheet(){
  const r=evaluate().find(x=>x.c.id===S.sheet);if(!r)return '';
  const c=r.c,tab=S.tab||'custos';
  const body={custos:()=>custosTab(r),motor:()=>motorTab(c),consumo:()=>consumoTab(r),espaco:()=>espacoTab(c),equip:()=>equipHtml(c),valor:()=>valorTab(r)}[tab]();
  return `<div class="sheet-bg" data-close="1"></div><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
   <header class="sh-h"><div><p class="sh-k">${c.m}</p><h3 id="sh-t">${c.mod} <span class="yr">${ANO-r.pr.anos}</span></h3><p class="ver">${c.ver} · ${brl(r.pr.v)}</p></div><button class="sh-x" data-close="1" aria-label="Fechar ficha">✕</button></header>
   <nav class="tabs" role="tablist">${TABS.map(([k,t])=>`<button role="tab" aria-selected="${k===tab}" data-tab="${k}">${t}</button>`).join('')}</nav>
   <div class="sh-b">${body}</div></section>`;
}

   <p class="mut">${c.bags} airbags${c.ano&&c.ano<2015?', sem Isofix':', Isofix'} · ${c.lug} lugares · ${c.portas||4} portas</p></div>`;
}

function results(){

   ${cmpRow('Preço estimado',r=>brl(r.pr.v),r=>-r.pr.v)}
   ${hasFin?cmpRow('Parcela',r=>r.cu.f&&r.cu.f.parcela?brl(r.cu.f.parcela):'Sem parcela',r=>-(r.cu.f?r.cu.f.parcela:0)):''}
   ${cmpRow('Seguro (média)',r=>brl(r.cu.seg.mid),r=>-r.cu.seg.mid)}
   ${cmpRow('IPVA',r=>brl(r.cu.ipva),r=>-r.cu.ipva)}
   ${cmpRow('Combustível/mês',r=>brl(r.cu.comb/12),r=>-r.cu.comb)}

   ${hasFin?cmpRow('Total com a parcela',r=>brl(r.cu.comParcela/12)+'/mês',r=>-r.cu.comParcela):''}
   ${cmpRow('Ano',r=>ANO-r.pr.anos,r=>-r.pr.anos)}
   ${cmpRow('Motor',r=>r.c.mot.replace(/,.*/,'')+', '+r.c.cvn+' cv')}
   ${cmpRow('Itens de conforto e tecnologia',r=>ITENS.filter(([k])=>hasItem(r.c,k)).length+' de '+ITENS.length,r=>ITENS.filter(([k])=>hasItem(r.c,k)).length)}
   ${cmpRow('Porta-malas',r=>r.pm+' L',r=>r.pm)}
   ${cmpRow('Potência',r=>r.c.cvn+' cv',r=>r.c.cvn/r.c.peso)}
   ${cmpRow('Altura do solo',r=>r.c.alt+' mm',r=>r.c.alt)}
   ${cmpRow('Comprimento',r=>n1(r.c.dim[0]/1000)+' m',r=>-r.c.dim[0])}

   ${cmpRow('Valor após 3 anos',r=>brl(depRows(r.c,r.pr)[1][1]),r=>depRows(r.c,r.pr)[1][1]/r.pr.v)}
  </tbody></table></div></section>`:''}
  <section class="panel"><h3>Premissas do cálculo</h3><p>Ajuste para os valores da sua cidade e do seu banco.</p><div class="fuel">

let flashT;function flash(msg){const f=document.getElementById('flash');f.textContent=msg;clearTimeout(flashT);flashT=setTimeout(()=>f.textContent='',4200)}
function refreshNav(){const b=document.querySelector('[data-go="next"]');if(b)b.disabled=!STEPS[S.step].ok();const n=document.getElementById('notes');if(n)n.innerHTML=notesHtml();save()}
function rerenderBody(){const b=document.getElementById('body');if(b)b.innerHTML=STEPS[S.step].html();refreshNav()}
function showSheet(){const el=document.getElementById('sheet');el.innerHTML=S.sheet?sheet():'';document.body.classList.toggle('locked',!!S.sheet);save();const x=el.querySelector('.sh-x');if(x)x.focus()}
function closeSheet(){S.sheet=null;showSheet();const b=document.querySelector(`[data-open="${S.lastOpen}"]`);if(b)b.focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet)closeSheet()});
document.addEventListener('click',e=>{
  if(e.target.classList&&e.target.classList.contains('sheet-bg')){closeSheet();return}
  const t=e.target.closest('button');if(!t)return;
  const a=A();
  if(t.dataset.off){flash(t.dataset.off);return}
  if(t.dataset.k&&t.dataset.v!==undefined){
    const k=t.dataset.k;let v=t.dataset.v;if(k==='prazo')v=+v;
    if(t.dataset.multi){
      let arr=[...a[k]];const max=+t.dataset.max||0,excl=t.dataset.excl;
      if(has(arr,v))arr=arr.filter(x=>x!==v);
      else{if(excl&&v===excl)arr=[v];else{arr=arr.filter(x=>x!==excl);if(max&&arr.length>=max)arr.pop();arr.push(v)}}
      if(k==='marcasPref')a.marcasEvitar=a.marcasEvitar.filter(x=>!has(arr,x));
      if(k==='marcasEvitar')a.marcasPref=a.marcasPref.filter(x=>!has(arr,x));
      a[k]=arr;
    }else a[k]=v;
    if(k==='pernoite'&&v==='rua')a.vagaTam='';
    S.rej=[];S.extra=0;rerenderBody();return;
  }
  if(t.dataset.st){const k=t.dataset.st;a[k]=Math.min(+t.dataset.max,Math.max(+t.dataset.min,a[k]+ +t.dataset.d));rerenderBody();return}
  if(t.dataset.jump!==undefined){S.screen='q';S.step=+t.dataset.jump;render();scrollTo(0,0);return}
  if(t.dataset.open){S.sheet=t.dataset.open;S.tab='custos';S.lastOpen=t.dataset.open;showSheet();return}
  if(t.dataset.tab){S.tab=t.dataset.tab;showSheet();return}
  if(t.dataset.close){closeSheet();return}
  if(t.dataset.rej){S.rej.push(t.dataset.rej);render();return}
  if(t.dataset.unrej){S.rej=S.rej.filter(x=>x!==t.dataset.unrej);render();return}
  const go=t.dataset.go;if(!go)return;
  if(go==='start'){S.screen='q';render()}
  else if(go==='reset'){S={screen:'q',step:0,A:fresh(),P:{...PDEF},rej:[],extra:0,sheet:null,tab:'custos'};render()}
  else if(go==='next'){if(!STEPS[S.step].ok())return;if(S.step<STEPS.length-1)S.step++;else S.screen='resumo';render()}
  else if(go==='back'){if(S.screen==='resumo'){S.screen='q';S.step=STEPS.length-1}else if(S.step>0)S.step--;else S.screen='intro';render()}
  else if(go==='results'){S.screen='res';S.rej=[];S.extra=0;render()}
  else if(go==='more'){S.extra++;render();return}
  else if(go==='ent30'){const tr=a.troca==='sim'?a.valorTroca:0;a.entrada=Math.min(300000,Math.ceil(Math.max(0,a.orcamento*ENT_MIN-tr)/5000)*5000);rerenderBody();return}
  else if(go==='edit'){S.screen='resumo';render()}
  scrollTo(0,0);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.range){const k=t.dataset.range;A()[k]=+t.value;const o=document.getElementById('o-'+k);if(o&&RFMT[k])o.textContent=RFMT[k](+t.value);refreshNav()}
  if(t.dataset.in){A()[t.dataset.in]=t.value;refreshNav()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.in){A()[t.dataset.in]=t.value;refreshNav()}
  if(t.dataset.tr){const a=A(),k=t.dataset.tr;a[k]=t.value;
    if(k==='trocaMarca'){a.trocaMod='';a.trocaAno=''}if(k==='trocaMod')a.trocaAno='';
    const v=trocaFipe();if(v)a.valorTroca=Math.min(300000,Math.max(5000,Math.round(v*TROCA_PCT/1000)*1000));
    rerenderBody();return}
  if(t.dataset.par){const v=parseFloat(String(t.value).replace(',','.'));if(v>0){S.P[t.dataset.par]=v;render()}}

/* Regras de senha e e-mail (valem no cadastro e na troca de senha) */
const senhaCheck=p=>{p=String(p||'');const r={len:p.length>=8,up:/[A-Z]/.test(p),low:/[a-z]/.test(p),dig:/[0-9]/.test(p),esp:/[!-\/:-@\[-`{-~]/.test(p),max:p.length<=72,sp:!/\s/.test(p)};r.ok=r.len&&r.up&&r.low&&r.dig&&r.esp&&r.max&&r.sp;return r};
const emailOk=e=>typeof e==='string'&&e.length<=254&&/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
const nomeLimpo=n=>String(n||'').replace(/[\u0000-\u001f<>]/g,'').trim().slice(0,40);

const PMCFG=window.PM_CONFIG||{};
const LIVE=!!(PMCFG.url&&PMCFG.key&&!PMCFG.demo&&/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(PMCFG.url));
const ERR={
  limite:'As vagas do site já foram preenchidas. Volte em breve.',

  rede:'Sem conexão com o servidor. Tente de novo em instantes.',
  fraca:'A senha precisa de 8 ou mais caracteres, com letra maiúscula, minúscula, número e um caractere especial.',
  generico:'Não foi possível concluir. Tente de novo.',
  sessao:'Sua sessão expirou. Entre de novo.',

};
const PMErro=(k,det)=>{const e=new Error(ERR[k]||ERR.generico);e.tipo=k;e.det=det;return e};
const traduz=m=>{m=String(m||'');for(const k of ['muitos_posts','muitos_comentarios','post_indisponivel'])if(m.includes(k))return PMErro(k);return null};

/* ---------- Servidor real (Supabase: Auth + REST), só com fetch ---------- */
const Real={
  sess:null,
  ler(){try{this.sess=JSON.parse(localStorage.getItem('pm-sessao')||'null')}catch(e){this.sess=null}},
  gravar(s){this.sess=s;try{s?localStorage.setItem('pm-sessao',JSON.stringify(s)):localStorage.removeItem('pm-sessao')}catch(e){}},
  jwt(t){try{return JSON.parse(decodeURIComponent(escape(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))))}catch(e){return {}}},
  monta(d){const p=this.jwt(d.access_token);return {token:d.access_token,refresh:d.refresh_token,exp:p.exp||Date.now()/1000+(d.expires_in||3600),uid:p.sub,email:p.email||''}},
  async http(url,opt){let r;try{r=await fetch(url,opt)}catch(e){throw PMErro('rede')}let j=null;try{j=await r.json()}catch(e){}return {ok:r.ok,status:r.status,j}},
  async auth(path,body){
    const r=await this.http(PMCFG.url+'/auth/v1/'+path,{method:'POST',headers:{apikey:PMCFG.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok){const m=(r.j&&(r.j.msg||r.j.message||r.j.error_description))||'';const e=new Error(m);e.status=r.status;throw e}return r.j},
  async token(){
    if(!this.sess)return null;
    if(this.sess.exp>Date.now()/1000+60)return this.sess.token;
    try{const d=await this.auth('token?grant_type=refresh_token',{refresh_token:this.sess.refresh});this.gravar(this.monta(d));return this.sess.token}
    catch(e){this.gravar(null);throw PMErro('sessao')}},
  async rest(method,path,body,prefer){
    const t=await this.token();
    const h={apikey:PMCFG.key,Authorization:'Bearer '+(t||PMCFG.key)};
    if(body!==undefined)h['Content-Type']='application/json';if(prefer)h.Prefer=prefer;
    const r=await this.http(PMCFG.url+'/rest/v1/'+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});
    if(!r.ok){const m=(r.j&&(r.j.message||r.j.hint||r.j.details))||'';const e=traduz(m)||(r.status===401||r.status===403&&/jwt/i.test(m)?PMErro('sessao'):PMErro('generico',m));throw e}
    return r.j},
  rpc(n,a){return this.rest('POST','rpc/'+n,a||{})},
  async vagas(){try{const v=await this.rpc('vagas_info');return v&&typeof v.limite==='number'?v:{limite:10,usadas:0}}catch(e){return {limite:10,usadas:0}}},
  async cadastrar(email,senha){
    try{
      const d=await this.auth('signup',{email,password:senha});
      if(d.access_token){this.gravar(this.monta(d));return this.eu()}
      return this.entrar(email,senha);
    }catch(e){
      if(e.tipo)throw e;
      if(/already|registered|exists/i.test(e.message))throw PMErro('existe');
      if(/password|senha|weak/i.test(e.message))throw PMErro('fraca');
      if(/database error|limite/i.test(e.message)||e.status===500){const v=await this.vagas();if(v.usadas>=v.limite)throw PMErro('limite')}
      throw PMErro('generico',e.message)}},
  async entrar(email,senha){
    try{const d=await this.auth('token?grant_type=password',{email,password:senha});this.gravar(this.monta(d));return this.eu()}
    catch(e){if(e.tipo)throw e;if(e.status===400||e.status===401||/invalid|credentials/i.test(e.message))throw PMErro('login');throw PMErro('generico',e.message)}},
  async sair(){const s=this.sess;this.gravar(null);if(s){try{await fetch(PMCFG.url+'/auth/v1/logout',{method:'POST',headers:{apikey:PMCFG.key,Authorization:'Bearer '+s.token}})}catch(e){}}},

    if(!this.sess)return null;

async function enviaAuth(){

function fcard(p,i){
  const t=FS.tot,tp=FT[p.tipo]||'Post',ed=p.editorial;
  const head=`<div class="tp ${ed?'ed':''}">${tp}${ed?' · PossantMatch':''}</div>`;
  const stat=p.status==='pendente'?`<div class="stat">Em análise. Só você vê este post até o administrador aprovar.</div>`:p.status==='rejeitado'?`<div class="stat bad">Não aprovado${p.motivo?`: ${esc(p.motivo)}`:''}.</div>`:'';
  let body='',extra='';
  const aprov=p.status==='aprovado';
  if(p.tipo==='duelo'&&(p.opcoes||[]).length===2){
    const c=[0,1].map(k=>(t.votos[p.id]||{})[k]||0),tot=c[0]+c[1],mv=t.meusVotos[p.id],show=mv!==undefined;
    const pc=k=>tot?Math.round(c[k]/tot*100):0;extra=tot+(tot===1?' voto':' votos');
    body=`<div class="duelwrap"><div class="duel">${[0,1].map(k=>`<button data-h="vote" data-id="${esc(p.id)}" data-i="${k}" ${aprov?'':'disabled'} class="${mv===k?'mine':''}" aria-label="Votar em ${esc(p.opcoes[k])}"><span class="fill" style="height:${show?pc(k):0}%"></span>${show?`<span class="pc">${pc(k)}%</span>`:''}<span class="nm">${esc(p.opcoes[k])}</span><span class="sp">${esc(carLine(p.opcoes[k]))}</span></button>`).join('')}</div><span class="vs">VS</span></div><div style="height:6px"></div>`;
    return fcardBase(p,i,head+stat,`<h3>${esc(p.titulo)}</h3>${p.texto?`<p class="txt">${esc(p.texto)}</p>`:''}`,body,extra,true);
  }
  if(p.tipo==='enquete'&&p.opcoes){
    const c=p.opcoes.map((_,k)=>(t.votos[p.id]||{})[k]||0),tot=c.reduce((a,b)=>a+b,0),mv=t.meusVotos[p.id],show=mv!==undefined;extra=tot+(tot===1?' voto':' votos');
    body=`<div class="opts">${p.opcoes.map((o,k)=>`<button data-h="vote" data-id="${esc(p.id)}" data-i="${k}" ${aprov?'':'disabled'} class="${mv===k?'mine':''}"><i class="b" style="width:${show&&tot?Math.round(c[k]/tot*100):0}%"></i><span>${esc(o)}</span>${show?`<span>${tot?Math.round(c[k]/tot*100):0}%</span>`:''}</button>`).join('')}</div>`;
    return fcardBase(p,i,head+stat,`<h3>${esc(p.titulo)}</h3>${p.texto?`<p class="txt">${esc(p.texto)}</p>`:''}`,body,extra,false);
  }
  const tags=(p.carros||[]).length?`<div class="tags">${p.carros.map(c=>`<span class="tag">${esc(c)}</span>`).join('')}</div>`:'';
  return fcardBase(p,i,head+stat,`${p.titulo?`<h3>${esc(p.titulo)}</h3>`:''}${p.texto?`<p class="txt ${p.tipo==='opiniao'?'big':''}">${esc(p.texto)}</p>`:''}${tags}`,'','',false);
}

async function fAct(h,t){
  const falha=e=>aviso(e&&e.message||ERR.generico);
  if(h==='vote'){
    if(!exigeConta('Crie sua conta para votar.'))return;
    const id=t.dataset.id;if(FS.tot.meusVotos[id]!==undefined)return;
    try{await DB.votar(id,+t.dataset.i);FS.tot.meusVotos[id]=+t.dataset.i;const m=(FS.tot.votos[id]=FS.tot.votos[id]||{});m[+t.dataset.i]=(m[+t.dataset.i]||0)+1;render()}catch(e){falha(e)}
  }else if(h==='like'){
    if(!exigeConta('Crie sua conta para curtir.'))return;
    const id=t.dataset.id,on=!FS.tot.minhasCurtidas.has(id);
    try{await DB.curtir(id,on);on?FS.tot.minhasCurtidas.add(id):FS.tot.minhasCurtidas.delete(id);FS.tot.curtidas[id]=Math.max(0,(FS.tot.curtidas[id]||0)+(on?1:-1));render()}catch(e){falha(e)}
  }else if(h==='send'){
    const g=id=>{const e=document.getElementById(id);return e?e.value.trim():''},c=SH.compose,er=document.getElementById('fc-err');
    const bad=m=>{er.textContent=m;er.hidden=false};
    const doc={tipo:c.t,titulo:g('fc-title'),texto:g('fc-body')};
    if(c.t==='duelo'){const a=g('fc-a'),b=g('fc-b');if(!a||!b)return bad('Informe os dois carros.');if(a.toLowerCase()===b.toLowerCase())return bad('Escolha dois carros diferentes.');if(!doc.titulo)return bad('Escreva a pergunta do duelo.');doc.opcoes=[a,b]}
    else if(c.t==='enquete'){const o=[0,1,2,3].map(k=>g('fc-o'+k)).filter(Boolean);if(!doc.titulo)return bad('Escreva a pergunta da enquete.');if(o.length<2)return bad('Informe ao menos duas opções.');doc.opcoes=o}
    else if(c.t==='pergunta'){if(!doc.titulo)return bad('Escreva a sua pergunta.')}
    else if(!doc.texto&&!doc.titulo)return bad('Escreva a sua opinião.');
    const cs=g('fc-cars');if(cs)doc.carros=cs.split(',').map(x=>x.trim()).filter(Boolean).slice(0,4);
    t.disabled=true;
    try{await DB.criarPost(doc);SH.compose=null;fsheet();aviso(PM.me.admin?'Publicado.':'Enviado para aprovação. Aparece para todos depois que o administrador aprovar.');await carregaForum();scrollTo(0,0)}catch(e){t.disabled=false;bad(e.message||ERR.generico)}
  }else if(h==='reply'){
    const el=document.getElementById('fr-text'),x=el?el.value.trim():'',er=document.getElementById('fr-err');if(!x)return;t.disabled=true;
    try{await DB.comentar(t.dataset.id,x);FS.tot.comentarios[t.dataset.id]=(FS.tot.comentarios[t.dataset.id]||0)+1;await abreComentarios(t.dataset.id);render()}catch(e){t.disabled=false;er.textContent=e.message||ERR.generico;er.hidden=false}
  }else if(h==='apagarCom'){try{await DB.apagarComentario(t.dataset.id);const id=SH.open;FS.tot.comentarios[id]=Math.max(0,(FS.tot.comentarios[id]||1)-1);await abreComentarios(id);render()}catch(e){falha(e)}}
  else if(h==='apagarPost'){try{await DB.apagarPost(t.dataset.id);FS.posts=FS.posts.filter(p=>p.id!==t.dataset.id);render()}catch(e){falha(e)}}
}

/* ---------- FIPE (API pública parallelum, resposta guardada na sessão) ---------- */
const FIPE='https://parallelum.com.br/fipe/api/v2/cars';
async function fipeGet(p){
  const k='pm-fipe:'+p;try{const c=sessionStorage.getItem(k);if(c)return JSON.parse(c)}catch(e){}
  let r;try{r=await fetch(FIPE+p)}catch(e){throw new Error('Sem conexão com a FIPE. Tente de novo.')}
  if(r.status===429)throw new Error('O limite diário de consultas da FIPE foi atingido. Tente amanhã.');
  if(!r.ok)throw new Error('A FIPE não respondeu para essa consulta.');
  const j=await r.json();try{sessionStorage.setItem(k,JSON.stringify(j))}catch(e){}return j;
}

  const best=(f,min)=>{const v=cs.map(f);const ok=v.filter(x=>Number.isFinite(x));if(cs.length<2||!ok.length)return v.map(()=>false);const b=min?Math.min(...ok):Math.max(...ok);return v.map(x=>x===b)};
  const R=[['Preço de referência',c=>brl(c.p||c.pf),best(c=>c.p||c.pf,true)],['Combustível',c=>FUEL_LBL[c.fuel]],['Motor',c=>esc(c.mot)],['Potência',c=>esc(c.cv),best(c=>c.cvn)],['Torque',c=>esc(c.tq)],['Câmbio',c=>esc(c.cam)],
   ['Consumo',c=>consTxt(c)],['Porta-malas',c=>c.pm+' L',best(c=>c.pm)],['Lugares',c=>c.lug],['Comprimento',c=>c.dim[0].toLocaleString('pt-BR')+' mm'],['Entre-eixos',c=>c.dim[3].toLocaleString('pt-BR')+' mm',best(c=>c.dim[3])],['Altura do solo',c=>c.alt+' mm',best(c=>c.alt)],['Peso',c=>c.peso.toLocaleString('pt-BR')+' kg'],['Airbags',c=>c.bags,best(c=>c.bags)],['Garantia',c=>c.gar?c.gar+' anos':'—',best(c=>c.gar)]];
  const itens=ITENS.map(([k,l])=>[l,c=>N(c,k)?'Sim':'—']);
  const row=(l,f,b)=>`<tr><th scope="row">${l}</th>${cs.map((c,i)=>`<td class="${b&&b[i]?'best':''}">${f(c)}</td>`).join('')}</tr>`;
  return `<p class="mut">Escolha até 3 carros. Digite para buscar e selecione na lista.</p>
  <datalist id="cl">${NEW.map(c=>`<option value="${esc(carLabel(c))}">`).join('')}</datalist>
  <div class="cmpsel">${[0,1,2].map(k=>`<label>Carro ${k+1}<input class="field" id="cp-${k}" list="cl" data-h="cmpSet" data-k="${k}" placeholder="Marca, modelo e versão" value="${cs[k]?esc(carLabel(cs[k])):''}" autocomplete="off"></label>`).join('')}</div>
  ${cs.length?`<div class="cmp"><table><thead><tr><th></th>${cs.map(c=>`<th>${esc(c.mod)}<span class="mut">${esc(c.m)} ${esc(c.ver)}</span></th>`).join('')}</tr></thead><tbody>${R.map(r=>row(...r)).join('')}<tr class="sep"><th colspan="${cs.length+1}">Itens de série</th></tr>${itens.map(r=>row(...r)).join('')}</tbody></table></div><p class="mut">Em verde, o melhor valor entre os carros escolhidos. Valores de referência estimados; confirme na concessionária.</p>`:'<div class="empty2"><b>Nenhum carro escolhido</b>Digite o nome de um carro acima para começar.</div>'}`;
}

/* ---------- Etanol ou gasolina ---------- */
function toolEtanol(){
  const E=T.eta,pe=num2(E.e),pg=num2(E.g);
  const flex=NEW.filter(c=>c.ce&&c.cg&&(c.fuel==='flex'||c.fuel==='hibrido'));
  const car=CARS.find(c=>c.id===E.car&&c.ce&&c.cg);
  let rel=.7,txt='média de mercado (70%)';
  if(car){const ke=(car.ce[0]+car.ce[1])/2,kg=(car.cg[0]+car.cg[1])/2;rel=ke/kg;txt=`${esc(car.mod)} ${esc(car.ver)} (${Math.round(rel*100)}%)`}
  let out='';
  if(pe>0&&pg>0){
    const r=pe/pg,vale=r<=rel;
    const kg=car?(car.cg[0]+car.cg[1])/2:10,ke=kg*rel,cg=pg/kg,ce=pe/ke;
    out=`<div class="res-fipe"><span class="mut">Preço do etanol ÷ gasolina = ${n1(r*100)}% · ponto de virada deste carro = ${n1(rel*100)}%</span><h3>${vale?'Abasteça com etanol':'Abasteça com gasolina'}</h3>
    <p>Por quilômetro: etanol ${brl2(ce)} · gasolina ${brl2(cg)}. Em 1.000 km, a economia é de <b>${brl2(Math.abs(ce-cg)*1000)}</b> usando ${vale?'etanol':'gasolina'}.</p><span class="mut">${car?'Consumo médio entre cidade e estrada do carro escolhido.':'Sem carro escolhido, a conta usa 10 km/l na gasolina como exemplo.'}</span></div>`;
  }else out='<p class="notice">Informe os dois preços, em reais por litro.</p>';
  return `<div class="tf"><label>Etanol (R$/litro)<input class="field" id="et-e" data-h="etSet" data-k="e" inputmode="decimal" value="${esc(E.e)}"></label><label>Gasolina (R$/litro)<input class="field" id="et-g" data-h="etSet" data-k="g" inputmode="decimal" value="${esc(E.g)}"></label>
  <label>Seu carro (opcional)<input class="field" id="et-car" list="cf" data-h="etCar" placeholder="Marca, modelo e versão flex" value="${car?esc(carLabel(car)):''}" autocomplete="off"></label></div>
  <datalist id="cf">${flex.map(c=>`<option value="${esc(carLabel(c))}">`).join('')}</datalist>
  <p class="mut">Relação usada: ${txt}. A conta compara o preço por quilômetro rodado.</p>${out}`;
}

/* ---------- Financiamento (tabela Price) ---------- */
function pmt(pv,i,n){return i>0?pv*i/(1-Math.pow(1+i,-n)):pv/n}
function toolFin(){
  const F=T.fin,v=num(F.valor),e=num(F.ent)||0,n=Math.round(num2(F.n)),i=(num2(F.taxa)||0)/100;
  let out='';
  if(v>0&&n>=1&&n<=96&&e>=0&&e<v){
    const pv=v-e,p=pmt(pv,i,n),tot=p*n+e,jur=p*n-pv,pct=e/v*100;
    out=`<div class="res-fipe"><span class="mut">Financiando ${brl(pv)} em ${n}x a ${n1(i*100)}% ao mês</span><h3>Parcela de ${brl2(p)}</h3><p>Total pago: <b>${brl(tot)}</b> (entrada + parcelas). Juros: <b>${brl(jur)}</b>.</p>
    ${pct<30?`<p class="notice">A entrada de ${Math.round(pct)}% está abaixo dos 30% recomendados (${brl(v*.3)}).</p>`:`<p class="mut">Entrada de ${Math.round(pct)}%, acima dos 30% recomendados.</p>`}</div>
    <div class="cmp"><table><thead><tr><th>Prazo</th><th>Parcela</th><th>Juros</th><th>Total pago</th></tr></thead><tbody>${[24,36,48,60].map(m=>{const q=pmt(pv,i,m);return `<tr><td>${m}x</td><td>${brl(q)}</td><td>${brl(q*m-pv)}</td><td>${brl(q*m+e)}</td></tr>`}).join('')}</tbody></table></div><p class="mut">Simulação pela tabela Price, sem seguro, tarifas ou IOF. Peça o CET na proposta.</p>`;
  }else out='<p class="notice">Confira os valores: a entrada precisa ser menor que o valor do carro e o prazo fica entre 1 e 96 meses.</p>';
  const f=(k,l,m)=>`<label>${l}<input class="field" id="fn-${k}" data-h="finSet" data-k="${k}" inputmode="decimal" value="${esc(F[k])}" ${m||''}></label>`;
  return `<div class="tf">${f('valor','Valor do carro (R$)')}${f('ent','Entrada (R$)')}${f('n','Prazo (meses)')}${f('taxa','Taxa de juros (% ao mês)')}</div>${out}`;
}

const CAT=CATALOGO.rows.map(r=>Object.fromEntries(CATALOGO.cols.map((c,i)=>[c,r[i]])));
const CT={q:'',tipo:'',pbe:'',cat:'',ord:'marca',n:30};
const catKm=r=>r.tipo==='Elétrico'?null:(r.cg&&r.cg[1])||(r.ce&&r.ce[1])||null;
function catLista(){
  const q=CT.q.trim().toLowerCase();
  let l=CAT.filter(r=>(!q||(r.marca+' '+r.modelo+' '+r.versao+' '+r.motor).toLowerCase().includes(q))&&(!CT.tipo||r.tipo===CT.tipo)&&(!CT.pbe||r.pbe===CT.pbe)&&(!CT.cat||r.cat===CT.cat));
  if(CT.ord==='cons')l=[...l].sort((a,b)=>(catKm(b)||0)-(catKm(a)||0));else if(CT.ord==='aut')l=[...l].sort((a,b)=>(b.aut||0)-(a.aut||0));
  else l=[...l].sort((a,b)=>(a.marca+a.modelo+a.versao).localeCompare(b.marca+b.modelo+b.versao,'pt'));
  return l;
}
const catRow=r=>{
  const kmc=r.tipo==='Elétrico'?`${n1(r.ev[0])} / ${n1(r.ev[1])} km/l eq. · autonomia ${r.aut} km`:r.comb==='Flex'?`Gasolina ${r.cg[0]!=null?n1(r.cg[0])+' / '+n1(r.cg[1]):'—'} · Etanol ${r.ce[0]!=null?n1(r.ce[0])+' / '+n1(r.ce[1]):'—'} km/l`:r.cg[0]!=null?`${n1(r.cg[0])} / ${n1(r.cg[1])} km/l (${r.comb.toLowerCase()})`:'Consumo não divulgado';
  return `<article class="cr"><div><b>${esc(r.marca)} ${esc(r.modelo)}</b><span>${esc(r.versao)}</span><span class="mut">${esc(r.motor)} · ${esc(r.cambio)} · ${esc(r.cat)}</span></div><div class="crc"><span>${esc(r.tipo)}</span><span>${kmc}</span>${r.pbe?`<span class="pbe pbe${esc(r.pbe)}" title="Nota PBE na categoria">${esc(r.pbe)}</span>`:''}</div></article>`;
};

    case 'tool':T.tool=t.dataset.id;lsSet('pm-tool',T.tool);return ir('ferramentas');
    case 'entrar':return abreAuth(t.dataset.m||'entrar',t.dataset.why||'');
    case 'amodo':SH.auth={...SH.auth,modo:t.dataset.m,email:(document.getElementById('au-email')||{}).value||''};return fsheet();
    case 'verSenha':{const i=document.getElementById('au-senha');if(i)i.type=i.type==='password'?'text':'password';return}
    case 'fclose':SH.auth=SH.compose=SH.open=SH.conta=null;return fsheet();
    case 'conta':SH.conta=true;return fsheet();
    case 'sair':return DB.sair().then(()=>{PM.me=null;GA.lista=null;SH.conta=null;fsheet();FS.posts=[];ir(S.screen==='admin'||S.screen==='garagem'?'intro':S.screen);aviso('Você saiu da conta.')});
    case 'salvaNome':{const n=nomeLimpo((document.getElementById('ct-nome')||{}).value);return DB.setNome(n).then(()=>{PM.me.nome=n;SH.conta=null;fsheet();render();aviso('Nome salvo.')}).catch(x=>aviso(x.message))}
    case 'filter':FS.filtro=t.dataset.f;return render();
    case 'compose':if(!exigeConta('Crie sua conta para postar.'))return;SH.compose={t:'pergunta'};return fsheet();
    case 'ctype':{const g=id=>{const x=document.getElementById(id);return x?x.value:''};SH.compose={...SH.compose,title:g('fc-title'),body:g('fc-body'),t:t.dataset.f};return fsheet()}
    case 'open':if(!exigeConta('Crie sua conta para ver e escrever comentários.'))return;return abreComentarios(t.dataset.id);
    case 'vote':case 'like':case 'send':case 'reply':case 'apagarCom':case 'apagarPost':return fAct(h,t);
    case 'aprova':case 'rejeita':case 'novidade':case 'delNov':return admAct(h,t);
    case 'fav':return toggleFav(t.dataset.id);
    case 'cmpAdd':{const c=T.cmp.filter(x=>x!==t.dataset.id);c.unshift(t.dataset.id);T.cmp=c.slice(0,3);lsSet('pm-cmp',T.cmp);T.tool='comparador';return ir('ferramentas')}
    case 'vist':{const k=t.dataset.id,v=T.vist[k]||0;T.vist[k]=(v+1)%3;lsSet('pm-vist',T.vist);return pintaTool()}
    case 'vistLimpa':T.vist={};lsSet('pm-vist',T.vist);return pintaTool();
    case 'ttLoad':return ttCarrega();
    case 'catMais':CT.n+=30;return pintaCat();
  }
});
document.addEventListener('input',e=>{
  const t=e.target,h=t.dataset&&t.dataset.h;
  if(t.id==='au-senha'){if(SH.auth&&SH.auth.modo==='criar'){const el=document.getElementById('pwr');if(el)el.outerHTML=senhaDica(t.value)}return}
  if(!h)return;
  if(h==='fBusca'){T.fipe.filtro=t.value;pintaTool()}
  else if(h==='etSet'){T.eta[t.dataset.k]=t.value;pintaTool()}
  else if(h==='finSet'){T.fin[t.dataset.k]=t.value;pintaTool()}
  else if(h==='catSet'&&t.tagName==='INPUT'){CT[t.dataset.k]=t.value;CT.n=30;pintaCat()}
});
document.addEventListener('change',e=>{
  const t=e.target,h=t.dataset&&t.dataset.h;if(!h)return;
  if(h==='fMarca'||h==='fModelo'||h==='fAno')fipeStep(h,t.value);
  else if(h==='cmpSet'){const c=CARLBL.get(t.value.trim());const k=+t.dataset.k;const l=[...T.cmp];if(c){l[k]=c.id}else if(!t.value.trim()){l.splice(k,1)}else return;T.cmp=l.filter(Boolean).slice(0,3);lsSet('pm-cmp',T.cmp);pintaTool()}
  else if(h==='etCar'){const c=CARLBL.get(t.value.trim());T.eta.car=c?c.id:'';pintaTool()}
  else if(h==='catSet'&&t.tagName==='SELECT'){CT[t.dataset.k]=t.value;CT.n=30;pintaCat()}
});
document.addEventListener('submit',e=>{if(e.target&&e.target.id==='auth-form'){e.preventDefault();enviaAuth()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(SH.auth||SH.compose||SH.open||SH.conta)){SH.auth=SH.compose=SH.open=SH.conta=null;fsheet()}});
setInterval(()=>{if(S.screen==='forum'&&!SH.open&&!SH.compose&&!SH.auth&&!document.hidden)carregaForum()},30000);
(async function boot(){
  if(!SCREENS[S.screen]&&!['q','resumo','res'].includes(S.screen))S.screen='intro';
  render();
  await carregaEu();render();entrou(S.screen);
})();

</script>
</body>
</html>
